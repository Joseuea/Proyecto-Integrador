<!-- Componente reutilizable: menú de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark barra-navegacion sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🔧 {{ empresa }}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú de navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>

                <!-- Los módulos del sistema solo aparecen con la sesión iniciada -->
                {% if current_user.is_authenticated %}
                <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Panel</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('productos') }}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('clientes') }}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('proveedores') }}">Proveedores</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('facturacion') }}">Facturación</a></li>

                <!-- Nombre del usuario que tiene la sesión activa -->
                <li class="nav-item">
                    <span class="nav-link usuario-activo">👤 {{ current_user.nombre }}</span>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ url_for('logout') }}">Cerrar sesión</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ url_for('login') }}">Iniciar sesión</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
