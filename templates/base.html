<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ empresa }}: venta de materiales de construcción, fletes y mudanzas en Carapungo, Quito.">
    <meta name="author" content="{{ estudiante }}">

    <title>{% block title %}{{ empresa }}{% endblock %}</title>

    <!-- Bootstrap desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Mis estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Componentes comunes a todas las páginas -->
    {% include "components/header.html" %}
    {% include "components/navbar.html" %}

    <!-- Mensajes de confirmación o error -->
    {% include "components/mensajes.html" %}

    <!-- Zona que cambia en cada página -->
    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "components/footer.html" %}

    <!-- JavaScript de Bootstrap (necesario para el menú y el modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Mi archivo JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
